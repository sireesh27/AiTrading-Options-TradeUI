# IB Gateway Docker Setup — Live + Paper (gnzsnz/ib-gateway image)
#
# Port layout: the gateway binds to 127.0.0.1 INSIDE the container, and the image
# bridges it with socat to 4003 (live) / 4004 (paper). We publish those on the
# host as 4001 (live) / 4002 (paper), which is what ibkr_manager.py expects when
# IBKR_HOST is set. Bound to 127.0.0.1 on the host because the TWS API socket is
# unencrypted/unauthenticated — for a remote backend, change to 0.0.0.0 + firewall.
#
# Login/2FA: IBC auto-logs in. The LIVE login triggers an IB Key push on your phone
# — approve it. On timeout it re-tries (TWOFA_TIMEOUT_ACTION=restart).
# Live and paper are separate IBKR logins, so paper needs its own credentials
# (IBKR_PAPER_USERNAME / IBKR_PAPER_PASSWORD); falls back to live creds if unset.
#
# Usage:
#   docker compose -f docker-compose-ibkr.yml up -d
#   docker compose -f docker-compose-ibkr.yml logs -f
#   VNC:  live  -> vnc://127.0.0.1:5900   paper -> vnc://127.0.0.1:5901

services:

  ib-gateway-live:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-live
    restart: unless-stopped
    environment:
      TWS_USERID:                   ${IBKR_USERNAME}
      TWS_PASSWORD:                 ${IBKR_PASSWORD}
      TRADING_MODE:                 live
      VNC_SERVER_PASSWORD:          ${VNC_PASSWORD:-changeme123}
      TWS_ACCEPT_INCOMING:          accept
      READ_ONLY_API:                "no"
      TWOFA_TIMEOUT_ACTION:         restart
      RELOGIN_AFTER_TWOFA_TIMEOUT:  "yes"
      TWS_RESTART_TIME:             "23:45"
    ports:
      - "127.0.0.1:4001:4003"   # Live API  (socat bridge to internal 4001)
      - "127.0.0.1:5900:5900"   # VNC (live)
    volumes:
      - ibkr_live_settings:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  ib-gateway-paper:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-paper
    restart: unless-stopped
    environment:
      TWS_USERID:                   ${IBKR_PAPER_USERNAME:-${IBKR_USERNAME}}
      TWS_PASSWORD:                 ${IBKR_PAPER_PASSWORD:-${IBKR_PASSWORD}}
      TRADING_MODE:                 paper
      VNC_SERVER_PASSWORD:          ${VNC_PASSWORD:-changeme123}
      TWS_ACCEPT_INCOMING:          accept
      READ_ONLY_API:                "no"
      TWOFA_TIMEOUT_ACTION:         restart
      RELOGIN_AFTER_TWOFA_TIMEOUT:  "yes"
      TWS_RESTART_TIME:             "23:50"   # staggered from live
    ports:
      - "127.0.0.1:4002:4004"   # Paper API (socat bridge to internal 4002)
      - "127.0.0.1:5901:5900"   # VNC (paper)
    volumes:
      - ibkr_paper_settings:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

volumes:
  ibkr_live_settings:
  ibkr_paper_settings:
