# IB Gateway Docker Setup
# - Authenticates automatically on first start using IBC
# - Sessions last ~7 days; daily auto-restart at 11:45 PM ET (no re-auth needed)
# - When IBKR forces weekly re-login: connect via VNC on port 5900 and confirm once
#
# Usage:
#   docker compose -f docker-compose-ibkr.yml up -d
#   VNC viewer: vnc://localhost:5900  (password = VNC_PASSWORD in .env)

version: '3.8'

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: unless-stopped

    environment:
      # IBKR credentials
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}

      # 'live' or 'paper'
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}

      # VNC access for the weekly manual re-auth
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-changeme123}

      # IBC: auto-accept incoming API connections
      ACCEPT_INCOMING_CONNECTION: yes
      READ_ONLY_API: no

      # Auto-restart time (HH:MM) — Gateway restarts daily at this time
      # Brief ~2 min outage outside market hours; NO re-auth needed
      TWS_RESTART_TIME: "23:45"

    ports:
      - "4001:4001"   # Live trading API  → your ibkr_manager connects here
      - "4002:4002"   # Paper trading API
      - "5900:5900"   # VNC — use this for the weekly manual re-login

    volumes:
      # Persists Gateway settings & session tokens across container restarts.
      # This is the key to surviving the full week without re-auth.
      - ibkr_settings:/root/Jts
      - ibkr_logs:/var/log/ibgateway

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4001 || nc -z localhost 4002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # Give Gateway time to fully start up

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

volumes:
  ibkr_settings:   # Persists IBKR session — survives container restarts
  ibkr_logs:
