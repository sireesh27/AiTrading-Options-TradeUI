# IB Gateway Docker Setup — Live + Paper (gnzsnz/ib-gateway image)
#
# Port layout: the gateway binds to 127.0.0.1 INSIDE the container, and the image
# bridges it with socat to 4003 (live) / 4004 (paper). We publish those on the
# host as 4001 (live) / 4002 (paper), which is what ibkr_manager.py expects when
# IBKR_HOST is set. Bound to 127.0.0.1 on the host because the TWS API socket is
# unencrypted/unauthenticated — for a remote backend, change to 0.0.0.0 + firewall.
#
# Login/2FA: IBC auto-logs in. The LIVE login triggers an IB Key push on your phone
# — approve it. On timeout it re-tries (TWOFA_TIMEOUT_ACTION=restart).
#
# Session schedule (all times America/New_York):
#   - Daily AUTO_RESTART_TIME after market hours: gateway restarts, session is
#     reused, NO login needed.
#   - IBKR invalidates sessions every Sunday 01:00 ET; the first gateway start
#     after that needs a full login (2FA on live). The gateway-scheduler service
#     restarts the gateways Sunday 11:00 AM ET so that login happens then — one
#     IB Key tap per week, at a predictable time — and the nightly restart that
#     evening reuses the fresh session.
# Live and paper are separate IBKR logins, so paper needs its own credentials
# (IBKR_PAPER_USERNAME / IBKR_PAPER_PASSWORD); falls back to live creds if unset.
#
# Usage:
#   docker compose -f docker-compose-ibkr.yml up -d
#   docker compose -f docker-compose-ibkr.yml logs -f
#   VNC:  live  -> vnc://127.0.0.1:5900   paper -> vnc://127.0.0.1:5901

services:

  ib-gateway-live:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-live
    restart: unless-stopped
    environment:
      TWS_USERID:                   ${IBKR_USERNAME}
      TWS_PASSWORD:                 ${IBKR_PASSWORD}
      TRADING_MODE:                 live
      TZ:                           America/New_York
      VNC_SERVER_PASSWORD:          ${VNC_PASSWORD:-changeme123}
      TWS_ACCEPT_INCOMING:          accept
      READ_ONLY_API:                "no"
      TWOFA_TIMEOUT_ACTION:         restart
      RELOGIN_AFTER_TWOFA_TIMEOUT:  "yes"
      AUTO_RESTART_TIME:             "11:45 PM"   # daily, after market hours (TZ above); no re-login
    ports:
      - "127.0.0.1:4001:4003"   # Live API  (socat bridge to internal 4001)
      - "127.0.0.1:5900:5900"   # VNC (live)
    volumes:
      - ibkr_live_settings:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4001' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  ib-gateway-paper:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-paper
    restart: unless-stopped
    environment:
      TWS_USERID:                   ${IBKR_PAPER_USERNAME:-${IBKR_USERNAME}}
      TWS_PASSWORD:                 ${IBKR_PAPER_PASSWORD:-${IBKR_PASSWORD}}
      TRADING_MODE:                 paper
      TZ:                           America/New_York
      VNC_SERVER_PASSWORD:          ${VNC_PASSWORD:-changeme123}
      TWS_ACCEPT_INCOMING:          accept
      READ_ONLY_API:                "no"
      TWOFA_TIMEOUT_ACTION:         restart
      RELOGIN_AFTER_TWOFA_TIMEOUT:  "yes"
      AUTO_RESTART_TIME:             "11:50 PM"   # daily, after market hours; staggered from live
    ports:
      - "127.0.0.1:4002:4004"   # Paper API (socat bridge to internal 4002)
      - "127.0.0.1:5901:5900"   # VNC (paper)
    volumes:
      - ibkr_paper_settings:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4002' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Restarts the gateways every Sunday 11:00 AM ET (first start after IBKR's
  # Sunday 01:00 ET session reset) so the weekly 2FA login lands at a known time.
  # Talks to the Docker daemon through the mounted socket. Override the cron
  # expressions with WEEKLY_REAUTH_CRON_LIVE / _PAPER (5-field cron, TZ-local).
  gateway-scheduler:
    image: docker:cli
    container_name: ib-gateway-scheduler
    restart: unless-stopped
    environment:
      TZ: America/New_York
      CRON_LIVE:  ${WEEKLY_REAUTH_CRON_LIVE:-0 11 * * 0}
      CRON_PAPER: ${WEEKLY_REAUTH_CRON_PAPER:-5 11 * * 0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache tzdata >/dev/null 2>&1 || true
        { echo "$$CRON_LIVE docker restart ib-gateway-live"; echo "$$CRON_PAPER docker restart ib-gateway-paper"; } > /etc/crontabs/root
        echo "gateway-scheduler: TZ=$$TZ now=$$(date)"; echo "crontab:"; cat /etc/crontabs/root
        exec crond -f -l 6

volumes:
  ibkr_live_settings:
  ibkr_paper_settings:
