# IB Gateway Docker Setup — Live + Paper
#
# - Authenticates automatically on first start using IBC
# - Sessions last ~7 days; daily auto-restart at 11:45 PM ET (no re-auth needed)
# - When IBKR forces weekly re-login: connect via VNC and confirm once
#   Live VNC:  vnc://your-vm-ip:5900
#   Paper VNC: vnc://your-vm-ip:5901
#
# Usage:
#   docker compose -f docker-compose-ibkr.yml up -d
#   docker compose -f docker-compose-ibkr.yml logs -f

version: '3.8'

services:

  ib-gateway-live:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-live
    restart: unless-stopped

    environment:
      TWS_USERID:             ${IBKR_USERNAME}
      TWS_PASSWORD:           ${IBKR_PASSWORD}
      TRADING_MODE:           live
      VNC_SERVER_PASSWORD:    ${VNC_PASSWORD:-changeme123}
      ACCEPT_INCOMING_CONNECTION: yes
      READ_ONLY_API:          no
      TWS_RESTART_TIME:       "23:45"

    ports:
      - "4001:4001"   # Live API  → backend connects here
      - "5900:5900"   # VNC for live — weekly manual re-auth

    volumes:
      - ibkr_live_settings:/root/Jts
      - ibkr_live_logs:/var/log/ibgateway

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  ib-gateway-paper:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway-paper
    restart: unless-stopped

    environment:
      TWS_USERID:             ${IBKR_USERNAME}
      TWS_PASSWORD:           ${IBKR_PASSWORD}
      TRADING_MODE:           paper
      VNC_SERVER_PASSWORD:    ${VNC_PASSWORD:-changeme123}
      ACCEPT_INCOMING_CONNECTION: yes
      READ_ONLY_API:          no
      TWS_RESTART_TIME:       "23:50"   # stagger restart from live

    ports:
      - "4002:4001"   # Paper API → backend connects on 4002
      - "5901:5900"   # VNC for paper — weekly manual re-auth

    volumes:
      - ibkr_paper_settings:/root/Jts
      - ibkr_paper_logs:/var/log/ibgateway

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

volumes:
  ibkr_live_settings:
  ibkr_live_logs:
  ibkr_paper_settings:
  ibkr_paper_logs:
