[pytest]
asyncio_mode = auto
testpaths = tests
# The tests/gui suite needs Playwright + browsers + running servers; excluded
# from the default run. Run it explicitly with: pytest tests/gui
addopts = --ignore=tests/gui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
