# IBC Config — LIVE Trading
# Credentials are injected at runtime from .env by start_ibgateway.sh
# DO NOT hardcode credentials here

FIX=no

# Auth — filled in by start_ibgateway.sh from .env
IbLoginId=
IbPassword=

TradingMode=live

# Automatically accept incoming API connections (required for backend)
AcceptIncomingConnectionAction=accept

# If another session is already open, disconnect it and take over
ExistingSessionDetectedAction=primaryoverride

# Auto-dismiss the login dialog (2FA prompt etc.)
# Set to 'dismiss' if you don't use 2FA
SecondFactorAuthenticationExitRequested=no

# Auto-restart daily at this time (outside market hours)
ReloginAfterSecondFactorAuthenticationTimeout=no

# Accept incoming API connections without asking
AcceptIncomingConnectionAction=accept

# Dismiss any informational popups automatically
AcceptNonBrokerageAccountWarning=yes
DismissNSEComplianceNotice=yes
